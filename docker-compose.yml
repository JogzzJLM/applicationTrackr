services:
  applicationtrackr:
    build: .
    container_name: applicationtrackr
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      PYTHONUNBUFFERED: "1"
      APP_BASE_URL: "${APP_BASE_URL}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Europe/London}"
      PORT: "${PORT:-5000}"
      DATA_DIR: "/data"
      SCRAPER_INTERVAL_SECONDS: "${SCRAPER_INTERVAL_SECONDS:-300}"
      EMAIL_POLL_SECONDS: "${EMAIL_POLL_SECONDS:-60}"
      GMAIL_USER: "${GMAIL_USER}"
      GMAIL_APP_PASS: "${GMAIL_APP_PASS}"
      OUTLOOK_USER: "${OUTLOOK_USER}"
      OUTLOOK_APP_PASS: "${OUTLOOK_APP_PASS}"
      OUTLOOK_IMAP_HOST: "${OUTLOOK_IMAP_HOST:-outlook.office365.com}"
      OUTLOOK_IMAP_PORT: "${OUTLOOK_IMAP_PORT:-993}"
      EMAIL_USER: "${EMAIL_USER}"
      EMAIL_APP_PASS: "${EMAIL_APP_PASS}"
      EMAIL_IMAP_HOST: "${EMAIL_IMAP_HOST}"
      EMAIL_IMAP_PORT: "${EMAIL_IMAP_PORT:-993}"
      GOOGLE_SHEET_CSV_URL: "${GOOGLE_SHEET_CSV_URL}"
      GOOGLE_SHEET_WEBHOOK_URL: "${GOOGLE_SHEET_WEBHOOK_URL}"
      NTFY_BASE_URL: "${NTFY_BASE_URL:-https://ntfy.sh}"
      NTFY_TOPIC: "${NTFY_TOPIC}"
      NTFY_TOKEN: "${NTFY_TOKEN}"
      HEALTHCHECKS_PING_URL: "${HEALTHCHECKS_PING_URL}"
      AUTOAPPLY_ENABLED: "${AUTOAPPLY_ENABLED:-false}"
      AUTOAPPLY_AUTO_SUBMIT: "${AUTOAPPLY_AUTO_SUBMIT:-false}"
      AUTOAPPLY_AUTOPILOT_ENABLED: "${AUTOAPPLY_AUTOPILOT_ENABLED:-false}"
      AUTOAPPLY_AUTOPILOT_MIN_SCORE: "${AUTOAPPLY_AUTOPILOT_MIN_SCORE:-82}"
      AUTOAPPLY_DAILY_LIMIT: "${AUTOAPPLY_DAILY_LIMIT:-3}"
      AUTOAPPLY_HEADLESS: "${AUTOAPPLY_HEADLESS:-true}"
      AUTOAPPLY_MAX_STEPS: "${AUTOAPPLY_MAX_STEPS:-8}"
      AUTOAPPLY_PAGE_TIMEOUT: "${AUTOAPPLY_PAGE_TIMEOUT:-30}"
      CHROMIUM_BINARY: "${CHROMIUM_BINARY:-/usr/bin/chromium}"
    volumes:
      - applicationtrackr_data:/data

volumes:
  applicationtrackr_data:
