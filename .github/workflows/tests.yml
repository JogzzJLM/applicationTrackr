name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m py_compile config.py email_listener.py core/relevance.py core/scoring.py core/storage.py scrapers_engine/ats_scrapers.py scrapers_engine/audit.py web/components.py web/views.py web/handlers.py web/autoapply_view.py autoapply/*.py
      - run: DATA_DIR=/tmp/applicationtrackr-test-data python -m unittest discover -s tests -v
